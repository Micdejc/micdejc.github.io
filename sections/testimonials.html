<section id="testimonials">

    <div class="container">

        <div class="section-header">

            <span class="section-number">
                11 / TESTIMONIALS
            </span>

            <h2>
                What people say about me
            </h2>

            <p class="section-intro">
                Perspectives from colleagues, collaborators, students,
                and professionals I have worked with.
            </p>

        </div>


        <div
            class="testimonials-list"
            id="testimonials-list"
        ></div>


        <div class="testimonials-controls">

            <button
                type="button"
                id="previousTestimonial"
                class="testimonial-arrow"
                aria-label="Previous testimonial"
            >
                ←
            </button>

            <span
                id="testimonialCounter"
                class="testimonial-counter"
            >
                1 / 1
            </span>

            <button
                type="button"
                id="nextTestimonial"
                class="testimonial-arrow"
                aria-label="Next testimonial"
            >
                →
            </button>

        </div>

    </div>

</section>
