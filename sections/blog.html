<section class="blog-section" id="blog">

    <div class="blog-header">

        <span class="section-eyebrow">BLOG</span>

        <h2>Insights, Research & Perspectives</h2>

        <p>
            Thoughts and articles on cybersecurity, AI security,
            research, technology, and professional development.
        </p>

    </div>


    <!--
        ============================================================
        BLOG SOURCE DATA
        ============================================================

        Add new blog posts here.

        Required:
        data-title
        data-date
        data-category
        data-type
        data-url

        data-type:
        internal = article hosted on this website
        external = article hosted elsewhere

        Optional:
        data-description
        data-tags

        Reading time is calculated automatically for internal
        HTML articles. Do NOT add a reading-time field.
        ============================================================
    -->

    <div class="blog-source-data" id="blog-source">

        <!-- INTERNAL ARTICLE EXAMPLE -->

        <article
            class="blog-entry"
            data-title="The Cybersecurity Experience Paradox"
            data-date="2026-08-31"
            data-category="Cybersecurity"
            data-type="internal"
            data-url="blog/posts/cybersecurity-experience-paradox.html"
            data-description="Exploring the paradox between cybersecurity experience and the opportunities available to develop it."
            data-tags="Cybersecurity,Professional Development"
        ></article>


        <!--
        ============================================================
        ADD MORE INTERNAL ARTICLES LIKE THIS
        ============================================================

        <article
            class="blog-entry"
            data-title="Your Article Title"
            data-date="2026-09-10"
            data-category="AI Security"
            data-type="internal"
            data-url="blog/posts/your-article.html"
            data-description="A short description of your article."
            data-tags="AI Security,LLM Security,Research"
        ></article>
        -->


        <!--
        ============================================================
        EXTERNAL ARTICLE EXAMPLE
        ============================================================

        Reading time is intentionally NOT included.

        External pages are not scraped because browsers may block
        cross-origin requests through CORS.
        ============================================================
        -->

        <article
            class="blog-entry"
            data-title="Humans as the Main Social Engineering Target"
            data-date="2026-08-15"
            data-category="Cybersecurity"
            data-type="external"
            data-url="https://example.com/your-article"
            data-description="Why humans remain a critical target in modern social engineering attacks."
            data-tags="Cybersecurity,Social Engineering,Human Risk"
        ></article>


    </div>


    <!-- FILTERS -->

    <div class="blog-controls">

        <div class="blog-filter">

            <label for="blog-category-filter">
                Category
            </label>

            <select id="blog-category-filter">
                <option value="all">All categories</option>
            </select>

        </div>


        <div class="blog-filter">

            <label for="blog-type-filter">
                Source
            </label>

            <select id="blog-type-filter">

                <option value="all">
                    All posts
                </option>

                <option value="internal">
                    My website
                </option>

                <option value="external">
                    External
                </option>

            </select>

        </div>

    </div>


    <!-- BLOG POSTS ARE RENDERED HERE -->

    <div
        class="blog-posts"
        id="blog-posts"
        aria-live="polite"
    ></div>


    <!-- EMPTY STATE -->

    <div
        class="blog-empty"
        id="blog-empty"
        hidden
    >
        <p>No blog posts match your selected filters.</p>
    </div>

</section>
