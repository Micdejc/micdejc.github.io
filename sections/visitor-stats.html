<section
    class="visitor-stats"
    aria-label="Website visitor statistics"
>

    <!-- Total Visitors -->
    <div class="visitor-stat">

        <span
            class="visitor-stat-icon"
            aria-hidden="true"
        >👥</span>

        <div class="visitor-stat-content">

            <strong
                id="total-visitors"
                class="visitor-stat-value"
            >—</strong>

            <span class="visitor-stat-label">
                Total Visitors
            </span>

        </div>

    </div>


    <!-- This Month -->
    <div class="visitor-stat">

        <span
            class="visitor-stat-icon"
            aria-hidden="true"
        >📅</span>

        <div class="visitor-stat-content">

            <strong
                id="monthly-visitors"
                class="visitor-stat-value"
            >—</strong>

            <span class="visitor-stat-label">
                This Month
            </span>

        </div>

    </div>

</section>
