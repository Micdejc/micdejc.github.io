<section
    class="visitor-stats"
    aria-label="Website visitor statistics"
>

    <div class="visitor-stat">
        <span class="visitor-stat-icon">👥</span>

        <div>
            <strong>
                <img
                    id="total-visitors"
                    class="visitor-stat-counter"
                    src=""
                    alt="Total visitors"
                >
            </strong>

            <span>Total Visitors</span>
        </div>
    </div>

    <div class="visitor-stat">
        <span class="visitor-stat-icon">📅</span>

        <div>
            <strong>
                <img
                    id="monthly-visitors"
                    class="visitor-stat-counter"
                    src=""
                    alt="Visitors this month"
                >
            </strong>

            <span>This Month</span>
        </div>
    </div>

</section>
