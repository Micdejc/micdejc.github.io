<section
    class="visitor-stats"
    aria-label="Website visitor statistics"
>

    <div class="visitor-stat">

        <span
            class="visitor-stat-icon"
            aria-hidden="true"
        >👥</span>

        <div class="visitor-stat-content">

            <div
                id="total-visitors"
                class="visitor-stat-value"
                aria-label="Total visitors"
            >—</div>

            <span class="visitor-stat-label">
                Total Visitors
            </span>

        </div>

    </div>


    <div class="visitor-stat">

        <span
            class="visitor-stat-icon"
            aria-hidden="true"
        >📅</span>

        <div class="visitor-stat-content">

            <div
                id="monthly-visitors"
                class="visitor-stat-value"
                aria-label="Visitors this month"
            >—</div>

            <span class="visitor-stat-label">
                This Month
            </span>

        </div>

    </div>

</section>
