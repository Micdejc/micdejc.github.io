<!-- =========================================================
     CALENDAR MODAL
========================================================= -->

<div
    class="calendar-modal"
    id="calendarModal"
    aria-hidden="true"
>

    <div
        class="calendar-overlay"
        id="calendarOverlay"
    ></div>

    <div
        class="calendar-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="calendarTitle"
    >

        <button
            class="calendar-close"
            id="calendarClose"
            aria-label="Close calendar"
        >
            ×
        </button>

        <div class="calendar-header">

            <div>
                <span class="calendar-eyebrow">
                    EVENTS & HOLIDAYS
                </span>

                <h2 id="calendarTitle">
                    Calendar
                </h2>
            </div>

            <div
                class="calendar-today"
                id="calendarToday"
            ></div>

        </div>

        <div
            class="calendar-greeting"
            id="calendarGreeting"
            hidden
        ></div>


         
        <div class="calendar-search">

              <svg
                  class="calendar-search-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
              >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m16 16 4 4" stroke-linecap="round"></path>
              </svg>
          
              <input
                  type="search"
                  id="calendarSearch"
                  class="calendar-search-input"
                  placeholder="Search events..."
                  aria-label="Search calendar events"
                  autocomplete="off"
              >
          
              <button
                  type="button"
                  id="calendarSearchClear"
                  class="calendar-search-clear"
                  aria-label="Clear search"
                  hidden
              >×</button>
          
          </div>
          
          <p
              id="calendarSearchStatus"
              class="calendar-search-status"
              aria-live="polite"
              hidden
          ></p>

        <div
            class="calendar-next-event"
            id="calendarNextEvent"
        ></div>

        <div
            class="calendar-events"
            id="calendarEvents"
        >
            <p class="calendar-loading">
                Loading events...
            </p>
        </div>

    </div>

</div>
