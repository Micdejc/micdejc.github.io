
<!-- =========================================================
     CALENDAR MODAL
========================================================= -->

<div
    class="calendar-modal"
    id="calendarModal"
    aria-hidden="true"
>

    <!-- Calendar overlay -->
    <div
        class="calendar-overlay"
        id="calendarOverlay"
    ></div>


    <!-- Calendar panel -->
    <div
        class="calendar-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="calendarTitle"
    >

        <!-- Close calendar -->
        <button
            type="button"
            class="calendar-close"
            id="calendarClose"
            aria-label="Close calendar"
            title="Close calendar"
        >
            ×
        </button>


        <!-- =================================================
             CALENDAR HEADER
        ================================================== -->

        <div class="calendar-header">

            <div class="calendar-heading">

                <span class="calendar-eyebrow">
                    EVENTS &amp; HOLIDAYS
                </span>

                <h2 id="calendarTitle">
                    Calendar
                </h2>

            </div>

            <div
                class="calendar-today"
                id="calendarToday"
            ></div>

        </div>


        <!-- =================================================
             CALENDAR GREETING
        ================================================== -->

        <div
            class="calendar-greeting"
            id="calendarGreeting"
            hidden
        ></div>


        <!-- =================================================
             EXPANDABLE EVENT SEARCH
        ================================================== -->

        <div
            class="calendar-search"
            id="calendarSearchContainer"
        >

            <!-- Search toggle: search icon / close icon -->
            <button
                type="button"
                id="calendarSearchToggle"
                class="calendar-search-toggle"
                aria-label="Open event search"
                aria-expanded="false"
                aria-controls="calendarSearch"
                title="Search events"
            >

                <!-- Search icon -->
                <svg
                    class="calendar-search-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m16 16 4 4"></path>
                </svg>

                <!-- Close icon -->
                <svg
                    class="calendar-search-close-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    aria-hidden="true"
                >
                    <path d="m18 6-12 12"></path>
                    <path d="m6 6 12 12"></path>
                </svg>

            </button>


            <!-- Expandable search field -->
            <div
                class="calendar-search-field"
                id="calendarSearchField"
                aria-hidden="true"
                inert
            >

                <!-- Search icon inside the field -->
                <svg
                    class="calendar-search-field-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m16 16 4 4"></path>
                </svg>


                <!-- Search input -->
                <input
                    type="search"
                    id="calendarSearch"
                    class="calendar-search-input"
                    placeholder="Search events..."
                    aria-label="Search calendar events"
                    autocomplete="off"
                    spellcheck="false"
                    tabindex="-1"
                >


                <!-- Clear search query -->
                <button
                    type="button"
                    id="calendarSearchClear"
                    class="calendar-search-clear"
                    aria-label="Clear search"
                    title="Clear search"
                    hidden
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        aria-hidden="true"
                    >
                        <path d="m18 6-12 12"></path>
                        <path d="m6 6 12 12"></path>
                    </svg>

                </button>

            </div>

        </div>


        <!-- Search results announcement -->
        <p
            id="calendarSearchStatus"
            class="calendar-search-status"
            aria-live="polite"
            hidden
        ></p>


        <!-- =================================================
             NEXT UPCOMING EVENT
        ================================================== -->

        <div
            class="calendar-next-event"
            id="calendarNextEvent"
        ></div>


        <!-- =================================================
             CALENDAR EVENTS LIST
        ================================================== -->

        <div
            class="calendar-events"
            id="calendarEvents"
        >

            <p class="calendar-loading">
                Loading events...
            </p>

        </div>

    </div>

</div>
