<!-- =========================================================
     CALENDAR MODAL
========================================================= -->

<div
    class="calendar-modal"
    id="calendarModal"
    aria-hidden="true"
>

    <!-- Calendar overlay -->
    <div
        class="calendar-overlay"
        id="calendarOverlay"
    ></div>


    <!-- Calendar panel -->
    <div
        class="calendar-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="calendarTitle"
    >

        <!-- Close calendar modal -->
        <button
            type="button"
            class="calendar-close"
            id="calendarClose"
            aria-label="Close calendar"
            title="Close calendar"
        >
            ×
        </button>


        <!-- =================================================
             CALENDAR HEADER
        ================================================== -->

        <div class="calendar-header">

            <div class="calendar-heading">

                <!-- Header eyebrow -->
                <span class="calendar-eyebrow">
                    EVENTS &amp; HOLIDAYS
                </span>


                <!-- Calendar title and search button -->
                <div class="calendar-title-row">

                    <h2 id="calendarTitle">
                        Calendar
                    </h2>


                    <!-- =====================================
                         EXPANDABLE SEARCH
                    ====================================== -->
                    <div class="calendar-search" id="calendarSearchContainer">
          
                        <button
                            type="button"
                            id="calendarSearchToggle"
                            class="calendar-search-toggle"
                            aria-label="Open event search"
                            aria-expanded="false"
                            aria-controls="calendarSearch"
                        >
                            <svg
                                class="calendar-search-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >
                                <circle cx="11" cy="11" r="7"></circle>
                                <path d="m16 16 4 4" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    
                        <div class="calendar-search-field" id="calendarSearchField">
                            <input
                                type="search"
                                id="calendarSearch"
                                class="calendar-search-input"
                                placeholder="Search events..."
                                aria-label="Search calendar events"
                                autocomplete="off"
                                tabindex="-1"
                            >
                    
                            <button
                                type="button"
                                id="calendarSearchClear"
                                class="calendar-search-clear"
                                aria-label="Close search"
                                hidden
                            >×</button>
                        </div>
                    
                    </div>
                      

                </div>

            </div>

             
            <!-- Current date and time -->
            <div
                class="calendar-today"
                id="calendarToday"
            ></div>

        </div>


        <!-- =================================================
             CALENDAR GREETING
        ================================================== -->

        <div
            class="calendar-greeting"
            id="calendarGreeting"
            hidden
        ></div>


        <!-- =================================================
             SEARCH RESULTS STATUS
        ================================================== -->

        <p
            id="calendarSearchStatus"
            class="calendar-search-status"
            aria-live="polite"
            hidden
        ></p>


        <!-- =================================================
             NEXT UPCOMING EVENT
        ================================================== -->

        <div
            class="calendar-next-event"
            id="calendarNextEvent"
        ></div>


        <!-- =================================================
             CALENDAR EVENTS
        ================================================== -->

        <div
            class="calendar-events"
            id="calendarEvents"
        >

            <p class="calendar-loading">
                Loading events...
            </p>

        </div>

    </div>

</div>
